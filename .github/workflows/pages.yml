name: Demo site

# Builds the demo app and publishes it to GitHub Pages (https://eve-eng01.github.io/guidecursor/).
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Runs on every release, or by hand from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:demo
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/
      # Deep links like /guidecursor/events load the app instead of a 404 page
      - run: cp apps/demo/dist/index.html apps/demo/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
